# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/dsa_tracker_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration
app.cors.allowed-origins=http://localhost:4200,http://localhost:8080,https://sajalsantra.github.io

# JWT Configuration
app.jwt.secret=9a2f8c7e6b5d4c3b2a1e0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c
app.jwt.expiration-ms=7200000
app.jwt.access-token-expiration-ms=7200000
app.jwt.refresh-token-expiration-ms=604800000

# AI Configuration
app.gemini.api-key=${GEMINI_API_KEY:}

